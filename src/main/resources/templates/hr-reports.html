<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HR Reports</title>
    <link rel="stylesheet" th:href="@{/css/daily-entry.css}">
</head>
<body>

<div class="page-container">

    <div class="page-header">
        <h1>HR Reports</h1>
        <a class="back-link" th:href="@{/hr-dashboard}">← Back to dashboard</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Action</th>
                <th>Status</th>
                <th>Created</th>
                <th>From</th>
                <th>To</th>
                <th>Description</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report : ${reports}">
                <td th:text="${report.id}"></td>
                <td th:text="${report.employee.email}"></td>
                <td th:text="${report.actionType}"></td>
                <td>
                    <form th:action="@{/hr-dashboard/reports/status/{id}(id=${report.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <select name="status" onchange="this.form.submit()">
                            <option th:each="s : ${T(pl.przystawski.ems.employee_mood_system.enums.Status).values()}"
                                    th:value="${s}"
                                    th:selected="${s == report.status}"
                                    th:text="${s}">
                            </option>
                        </select>
                    </form>
                </td>
                <td th:text="${#temporals.format(report.createdAt, 'dd.MM.yyyy')}"></td>
                <td th:text="${report.analysisFromDate}"></td>
                <td th:text="${report.analysisToDate}"></td>
                <td class="description" th:text="${report.description}"></td>
                <td>
                    <form th:action="@{/hr-dashboard/reports/delete/{id}(id=${report.id})}"
                          method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button class="delete-btn" type="submit">X</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>HR Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/daily-entry.css}">
</head>

<body>
<header class="top-bar">
    <div class="left">
        <span class="app-name">Employee Mood System</span>
    </div>

    <div class="right">
        <span sec:authentication="name"></span>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>
<div class="dashboard">

    <div class="dashboard-left">
        <a th:href="@{/hr-dashboard/reports}">
            <button type="button">View HR Reports</button>
        </a>

        <h1>HR – Employee Mood Analysis</h1>


        <form th:action="@{/hr-dashboard/analyze}"
              th:object="${form}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="employee">Employee</label>
                <select id="employee" th:field="*{employeeId}">
                    <option value="">-- choose employee --</option>
                    <option th:each="emp : ${employees}"
                            th:value="${emp.id}"
                            th:text="${emp.email}">
                    </option>
                </select>
                <div class="error" th:errors="*{employeeId}"></div>
            </div>

            <div class="form-group">
                <label for="fromDate">From</label>
                <input id="fromDate" type="date" th:field="*{fromDate}">
                <div class="error" th:errors="*{fromDate}"></div>
            </div>

            <div class="form-group">
                <label for="toDate">To</label>
                <input id="toDate" type="date" th:field="*{toDate}">
                <div class="error" th:errors="*{toDate}"></div>
            </div>

            <button type="submit">Analyze</button>

            <a th:href="@{/daily-entry}">
                <button type="button">Back</button>
            </a>
        </form>



        <div th:if="${entries != null}">
            <h2>
                Results from
                <span th:text="${#temporals.format(form.fromDate, 'dd.MM.yyyy')}"></span>
                to
                <span th:text="${#temporals.format(form.toDate, 'dd.MM.yyyy')}"></span>
            </h2>

            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Mood</th>
                    <th>Workload</th>
                    <th>Comfort</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${entries}">
                    <td th:text="${#temporals.format(entry.entryDate, 'dd.MM.yyyy')}"></td>
                    <td th:text="${entry.moodScore}"></td>
                    <td th:text="${entry.workloadScore}"></td>
                    <td th:text="${entry.comfortScore}"></td>
                </tr>
                </tbody>
            </table>

        </div>

    </div>


    <div class="dashboard-right"
          th:if="${entries != null}">
        <div class="alerts"
             th:if="${alerts != null and !alerts.isEmpty()}">

            <h2>Alerts</h2>

            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Severity</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alert : ${alerts}">
                    <td th:text="${#temporals.format(alert.createdAt, 'dd.MM.yyyy')}"></td>
                    <td th:text="${alert.alertType}"></td>
                    <td th:text="${alert.severity}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2>HR Report</h2>

    <form th:action="@{/hr-dashboard/report}"
          th:object="${reportForm}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>


        <input type="hidden" th:field="*{employeeId}">
        <input type="hidden" th:field="*{analysisFromDate}">
        <input type="hidden" th:field="*{analysisToDate}">
        <input type="hidden" th:field="*{alertId}">

        <div class="form-group">
            <label for="actionType">Action type</label>
            <select id="actionType" th:field="*{actionType}">
                <option value="">-- choose --</option>
                <option value="report">report</option>
                <option value="recommendation">recommendation</option>
                <option value="meeting">meeting</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">HR Description</label>
            <textarea id="description"
                      th:field="*{description}"
                      placeholder="Write HR conclusions..."></textarea>
        </div>

        <button type="submit">Save Report</button>
    </form>
</div>


</div>

</body>
</html>

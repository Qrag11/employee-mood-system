<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My HR Reports</title>
    <link rel="stylesheet" th:href="@{/css/daily-entry.css}">
</head>
<body>
<header class="top-bar">
    <div class="left">
        <span class="app-name">Employee Mood System</span>
    </div>

    <div class="right">
        <span sec:authentication="name"></span>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>
<div class="page-container">

    <div class="page-header">
        <h1>My HR Reports</h1>
        <a class="back-link" th:href="@{/daily-entry}">
            <button type="button">Back</button>
        </a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Action</th>
                <th>Status</th>
                <th>Created</th>
                <th>From</th>
                <th>To</th>
                <th>Description</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report : ${reports}">
                <td th:text="${report.actionType}"></td>

                <td>
                    <span class="status"
                          th:classappend="'status-' + ${report.status}">
                        <span th:text="${report.status}"></span>
                    </span>
                </td>

                <td th:text="${#temporals.format(report.createdAt, 'dd.MM.yyyy')}"></td>
                <td th:text="${report.analysisFromDate}"></td>
                <td th:text="${report.analysisToDate}"></td>
                <td class="description" th:text="${report.description}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
